name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Run stylua check
        uses: JohnnyMorganz/stylua-action@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  smoke:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.nvim == 'nightly' }}

    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.11.7, nightly]

    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim ${{ matrix.nvim }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nvim.tar.gz" \
            "https://github.com/neovim/neovim/releases/download/${{ matrix.nvim }}/nvim-linux-x86_64.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/nvim.tar.gz"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Isolate Neovim directories
        run: |
          base="$RUNNER_TEMP/nvim-home"
          mkdir -p "$base/config" "$base/data" "$base/state" "$base/cache"
          cp -R . "$base/config/nvim"
          {
            echo "XDG_CONFIG_HOME=$base/config"
            echo "XDG_DATA_HOME=$base/data"
            echo "XDG_STATE_HOME=$base/state"
            echo "XDG_CACHE_HOME=$base/cache"
          } >> "$GITHUB_ENV"

      - name: Show Neovim version
        run: nvim --version | head -n 1

      # init.lua installs missing plugins during startup, so lazy.nvim has to exist and the build skip
      # has to be loaded before it runs. vim-go's build downloads Go tools and is not needed to load the config.
      - name: Install plugins
        run: |
          git clone --filter=blob:none --branch=stable https://github.com/folke/lazy.nvim.git \
            "$XDG_DATA_HOME/nvim/lazy/lazy.nvim"
          nvim --headless --cmd "luafile scripts/ci/skip_build.lua" \
            "+lua require('lazy.manage').install({ wait = true, show = false })" +qa

      - name: Start config
        run: |
          nvim --headless +qa 2> "$RUNNER_TEMP/startup.err"
          cat "$RUNNER_TEMP/startup.err"
          test ! -s "$RUNNER_TEMP/startup.err"

      - name: Run checkhealth without crashing
        run: |
          nvim --headless "+checkhealth braintree-neovim" \
            "+lua vim.wait(60000, function() return vim.bo.filetype == 'checkhealth' end, 50)" \
            "+w! $RUNNER_TEMP/health.txt" +qa
          test -s "$RUNNER_TEMP/health.txt"
          if grep -Eq "Failed to run healthcheck|Error executing|E5108|stack traceback" "$RUNNER_TEMP/health.txt"; then
            exit 1
          fi

      - name: Load config modules
        run: nvim --headless -l scripts/ci/smoke.lua

      - name: Check LSP contract
        run: nvim --headless -l scripts/ci/check_contract.lua

      - name: Check lockfiles
        run: nvim --headless -l scripts/ci/check_lockfiles.lua

      - name: Regenerate cheatsheet in isolated config
        working-directory: ${{ runner.temp }}/nvim-home/config/nvim
        run: |
          nvim --headless -l scripts/ci/cheatsheet.lua
          cp CHEATSHEET.md "$GITHUB_WORKSPACE/CHEATSHEET.md"

      - name: Check CHEATSHEET.md is up to date
        run: git diff --exit-code CHEATSHEET.md

